<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soumik, design engineer</title>
<meta name="description" content="Soumik designs and builds interfaces end to end: brand, motion, WebGL, and the code that ships it.">
<meta name="theme-color" content="#f6f4ef">
<meta property="og:title" content="Soumik, design engineer">
<meta property="og:description" content="Grow a flower, meet the bee, see the work.">
<meta property="og:image" content="https://soumik.design/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Faculty Glyphic"; src: url(assets/faculty-glyphic.woff2) format("woff2"); font-display: swap; }
  :root {
    --paper: #f6f4ef; --ink: #1f1d1b; --ink-2: rgba(31, 29, 27, .56); --ink-3: rgba(31, 29, 27, .34); --line: rgba(31, 29, 27, .12);
    --ease: cubic-bezier(.23, 1, .32, 1); --spring: cubic-bezier(.3, 1.4, .5, 1);
    --display: "Instrument Sans", -apple-system, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace; --ui: -apple-system, system-ui, sans-serif;
    --gut: clamp(16px, 2.6vw, 36px);
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { background: var(--paper); color: var(--ink); font: 400 13px/1.45 var(--ui); overflow-x: hidden;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  ::selection { background: #d9def2; }
  :focus-visible { outline: 1.5px solid currentColor; outline-offset: 4px; border-radius: 6px; }

  /* ---- hero: one screen, the garden, the name, two links */
  .hero { position: relative; height: 100svh; min-height: 560px; overflow: hidden; }
  #garden { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: manipulation; }
  /* the UI floats over the garden; only real controls take the pointer, so every empty spot plants */
  .ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  .ui a, .ui button { pointer-events: auto; }

  .top { position: absolute; left: var(--gut); right: var(--gut); top: max(var(--gut), env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; }
  .me { display: flex; align-items: center; gap: 10px; font: 500 12px/1.2 var(--mono); }
  .me img { width: 40px; height: 40px; object-fit: contain; mix-blend-mode: multiply; transition: transform .5s var(--spring); }
  .me small { display: block; color: var(--ink-2); font-size: 11px; }
  .icons { display: flex; gap: 4px; }
  .icons a { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; color: var(--ink-2); transition: color .2s, background .2s, transform .16s var(--ease); }
  .icons a:active { transform: scale(.94); }
  .icons svg { width: 16px; height: 16px; }

  .mark { position: absolute; left: 50%; top: 17svh; translate: -50% 0; text-align: center; white-space: nowrap; }
  /* the wordmark: a script S that writes itself in, against a Bodoni "oumik" (baked to SVG in _dev) */
  .mark h1 { margin: 0; line-height: 0; }
  .wm { width: clamp(280px, 33vw, 480px); height: auto; display: block; margin: 0 auto; overflow: visible; }
  .wm-r { transform-box: fill-box; transform-origin: 0 50%; }
  .wm-o path { transform-box: fill-box; }
  .load .wm-r { animation: write 1.5s cubic-bezier(.6, .1, .25, 1) .35s both; }
  .load .wm-o path { animation: ink .9s var(--ease) both; animation-delay: calc(.75s + var(--i) * 70ms); }
  @keyframes write { from { transform: scaleX(0); } to { transform: none; } }
  @keyframes ink { from { opacity: 0; transform: translateY(40px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .mark p { margin-top: clamp(14px, 1.6vw, 20px); font: 400 12px/1.4 var(--mono); color: var(--ink-2); letter-spacing: .01em; }

  .nav { position: absolute; left: 50%; top: 77svh; translate: -50% 0; display: flex; gap: clamp(20px, 3.4vw, 56px); align-items: center; font: 500 13px/1 var(--mono); }
  .nav button { white-space: nowrap; display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 99px;
    transition: background .25s var(--ease), box-shadow .25s var(--ease), transform .16s var(--ease); }
  .nav button:active { transform: scale(.97); }
  .nav .arr { display: inline-block; transition: transform .4s var(--spring); }
  .nav .ic { width: 26px; height: 26px; display: grid; place-items: center; }
  .nav .ic img { width: 26px; height: 26px; object-fit: contain; mix-blend-mode: multiply; }
  .nav .ic svg { width: 30px; height: auto; overflow: visible; }

  .hint { position: absolute; left: 50%; top: calc(77svh + 48px); translate: -50% 0; font: 400 12px/1 var(--mono); color: var(--ink-2); white-space: nowrap;
    padding: 8px 12px; border-radius: 99px; transition: color .2s, transform .16s var(--ease); }
  .hint:active { transform: scale(.97); }
  .hint .fl span { display: inline-block; animation: bob 2.8s var(--ease) infinite; animation-delay: calc(var(--i) * .09s); }
  .hint .fl span:nth-child(1) { color: #3e4f9c; } .hint .fl span:nth-child(2) { color: #c25a7c; } .hint .fl span:nth-child(3) { color: #4b8bbf; }
  .hint .fl span:nth-child(4) { color: #3e4f9c; } .hint .fl span:nth-child(5) { color: #c25a7c; } .hint .fl span:nth-child(6) { color: #4b8bbf; }
  @keyframes bob { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-3px); } }
  .hint .swap { display: inline-block; transition: opacity .3s, filter .3s; }
  .hint .swap.out { opacity: 0; filter: blur(4px); }

  .mochi { position: absolute; width: 104px; left: calc(50% + 276px); top: calc(55svh + 96px); transition: transform .5s var(--spring); }
  .mochi svg { width: 100%; height: auto; display: block; overflow: visible; }
  .mochi .tag { position: absolute; left: 50%; bottom: 100%; translate: -50% 0; font: 500 11px/1 var(--mono); color: var(--ink-2); white-space: nowrap;
    opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .35s var(--spring); }
  .mochi:focus-visible .tag { opacity: 1; transform: none; }

  @media (hover: hover) and (pointer: fine) {
    .me:hover img { transform: rotate(-8deg) scale(1.08); }
    .icons a:hover { color: var(--ink); background: rgba(31, 29, 27, .05); }
    .nav button:hover { background: rgba(255, 255, 255, .6); box-shadow: 0 0 0 1px var(--line); }
    .nav button:hover .arr.r { transform: translateX(4px); }
    .nav button:hover .arr.d { transform: translateY(3px); }
    .hint:hover { color: var(--ink); }
    .mochi:hover { transform: translateY(-3px) rotate(-2deg); }
    .mochi:hover .tag { opacity: 1; transform: none; }
  }

  /* ---- the work lives right under the garden */
  #work { position: relative; scroll-margin-top: 0; }
  .foot { display: flex; justify-content: space-between; gap: 16px; padding: 28px var(--gut) max(22px, env(safe-area-inset-bottom));
    font: 400 10.5px/1.2 var(--mono); color: var(--ink-3); letter-spacing: .02em; }
  .foot nav { display: flex; gap: 14px; }
  .foot a { transition: color .2s; }
  @media (hover: hover) and (pointer: fine) { .foot a:hover { color: var(--ink); } }

  .in { opacity: 0; animation: in 1.1s var(--ease) forwards; animation-delay: var(--d, .2s); }
  @keyframes in { from { opacity: 0; translate: var(--tx, 0) 10px; filter: blur(6px); } to { opacity: 1; translate: var(--tx, 0) 0; filter: none; } }
  .mark.in, .nav.in, .hint.in { --tx: -50%; }

  @media (max-width: 640px) {
    .icons { display: none; }
    .mark { top: 15svh; }
    .wm { width: min(78vw, 330px); }
    .mark p { font-size: 11px; }
    .nav { top: auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px); gap: 4px; font-size: 12.5px; }
    .nav button { padding: 0 10px; min-height: 44px; gap: 7px; }
    .nav .ic, .nav .ic img { width: 20px; height: 20px; }
    .nav .ic svg { width: 24px; }
    .hint { top: auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 18px); font-size: 11.5px; min-height: 44px; }
    .mochi { width: 78px; left: auto; right: 14px; top: calc(50svh + 128px); }
    .foot { justify-content: center; }
    .foot > span { display: none; }
  }
  @media (max-height: 640px) and (min-width: 641px) { .mark { top: 11svh; } .nav { top: 78svh; } .hint { top: calc(78svh + 42px); } }
  @media (prefers-reduced-motion: reduce) {
    .in { animation: none; opacity: 1; }
    .hint .fl span { animation: none; }
    .load .wm-r, .load .wm-o path { animation: none; }
  }
</style>
</head>
<body>
<main>
  <section class="hero" id="top" aria-label="Garden">
    <canvas id="garden" aria-hidden="true"></canvas>
    <div class="ui">
      <div class="top in" style="--d:.1s">
        <a class="me" href="#about" data-about>
          <img src="assets/avatar.png" alt="" width="40" height="40" onerror="this.onerror=null;this.src='assets/avatar-src.jpg'">
          <span>soumik<small>design engineer</small></span>
        </a>
        <nav class="icons" aria-label="Elsewhere" id="icons"></nav>
      </div>

      <div class="mark in" style="--d:.25s">
        <h1 class="load"><svg class="wm" viewBox="64 -1133 3896 1377" fill="currentColor" role="img" aria-labelledby="wm-t"><title id="wm-t">Soumik</title><defs><clipPath id="wm-c"><rect class="wm-r" x="30" y="-1167" width="1496" height="1445"/></clipPath></defs><path class="wm-s" clip-path="url(#wm-c)" d="M619.5 238.0Q472.5 238.0 350.2 194.5Q228.0 151.0 153.0 66.2Q78.0 -18.5 70.5 -143.0Q67.5 -194.0 87.0 -255.5Q106.5 -317.0 141.7 -377.7Q177.0 -438.5 225.7 -487.2Q274.5 -536.0 330.0 -561.5Q334.5 -564.5 344.2 -566.0Q354.0 -567.5 358.5 -567.5Q367.5 -567.5 367.5 -563.0Q367.5 -555.5 345.0 -539.0Q282.0 -489.5 241.5 -425.0Q199.5 -360.5 178.5 -287.0Q157.5 -213.5 157.5 -138.5Q157.5 -50.0 195.7 13.7Q234.0 77.5 298.5 118.7Q363.0 160.0 445.5 179.5Q528.0 199.0 618.0 199.0Q718.5 199.0 816.7 176.5Q915.0 154.0 996.0 112.0Q1120.5 46.0 1193.2 -51.5Q1266.0 -149.0 1266.0 -245.0Q1266.0 -296.0 1244.2 -342.5Q1222.5 -389.0 1174.5 -426.5Q1138.5 -455.0 1086.7 -480.5Q1035.0 -506.0 977.2 -530.0Q919.5 -554.0 864.0 -578.7Q808.5 -603.5 766.5 -632.0Q706.5 -672.5 678.7 -719.0Q651.0 -765.5 651.0 -812.0Q651.0 -867.5 683.2 -920.0Q715.5 -972.5 771.7 -1015.2Q828.0 -1058.0 898.5 -1082.0Q960.0 -1103.0 1032.7 -1115.0Q1105.5 -1127.0 1176.0 -1127.0Q1234.5 -1127.0 1287.7 -1118.7Q1341.0 -1110.5 1381.5 -1089.5Q1432.5 -1065.5 1459.5 -1025.7Q1486.5 -986.0 1486.5 -942.5Q1486.5 -882.5 1432.5 -837.5Q1413.0 -822.5 1389.0 -809.7Q1365.0 -797.0 1332.0 -788.0Q1326.0 -786.5 1318.5 -786.5Q1300.5 -786.5 1300.5 -797.0Q1300.5 -803.0 1310.2 -809.7Q1320.0 -816.5 1339.5 -818.0Q1384.5 -824.0 1407.7 -852.5Q1431.0 -881.0 1431.0 -918.5Q1431.0 -957.5 1404.7 -995.7Q1378.5 -1034.0 1324.5 -1060.2Q1270.5 -1086.5 1186.5 -1086.5Q1138.5 -1086.5 1080.7 -1076.0Q1023.0 -1065.5 955.5 -1041.5Q873.0 -1013.0 818.2 -957.5Q763.5 -902.0 763.5 -839.0Q763.5 -800.0 789.7 -760.2Q816.0 -720.5 874.5 -684.5Q924.0 -654.5 987.0 -625.2Q1050.0 -596.0 1114.5 -566.7Q1179.0 -537.5 1231.5 -504.5Q1314.0 -453.5 1350.0 -395.0Q1386.0 -336.5 1386.0 -275.0Q1386.0 -203.0 1         <p>I design and build interfaces, end to end.</p>
      </div>

      <button class="mochi in" style="--d:1.4s" id="mochi" aria-label="mochi the cat, she shows you the work">
        <span class="tag">mochi · <span class="v">click</span> to see the work</span>
        <span id="mochi-art"></span>
      </button>

      <nav class="nav in" style="--d:.9s" aria-label="Main">
        <button data-about><span class="ic"><img src="assets/avatar.png" alt="" onerror="this.onerror=null;this.src='assets/avatar-src.jpg'"></span><span class="arr r">→</span> About me</button>
        <button data-work>My work <span class="arr d">↓</span><span class="ic" id="cat-ic"></span></button>
      </nav>

      <button class="hint in" style="--d:1.6s" id="hint"><span class="swap"><span class="v">click</span> anywhere to grow a <span class="fl"><span style="--i:0">f</span><span style="--i:1">l</span><span style="--i:2">o</span><span style="--i:3">w</span><span style="--i:4">e</span><span style="--i:5">r</span></span></span></button>
    </div>
  </section>

  <section id="work" aria-label="My work"></section>
</main>

<footer class="foot">
  <span>© 2026 soumik</span>
  <nav aria-label="Socials" id="socials"></nav>
  <span>flowers painted in webgl</span>
</footer>

<script type="module">
  import { SOCIALS, css } from './js/content.js';
  import { sleepyCat, CAT_CSS } from './js/cats.js';
  import { createBee, BEE_CSS } from './js/bee.js';
  import { peek } from './js/peek.js';
  import { createAbout } from './js/about.js';

  css(CAT_CSS + BEE_CSS);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;
  if (touch) document.querySelectorAll('.v').forEach(v => v.textContent = 'tap');

  const ICON = {
    LinkedIn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4v11H3v-11Zm6.5 0h3.8v1.6h.06c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.77 2.5 4.77 5.76v5.59h-4v-4.96c0-1.18-.02-2.7-1.7-2.7-1.7 0-1.95 1.28-1.95 2.61v5.05h-4v-11Z"/></svg>',
    X: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.32l4.37 5.78L17.75 3Zm-1.08 16.17h1.7L7.4 4.74H5.58l11.09 14.43Z"/></svg>',
    Email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>',
  };
  const ext = s => s.href.startsWith('http') ? ' target="_blank" rel="noopener"' : '';
  document.getElementById('icons').innerHTML = SOCIALS.map(s => `<a href="${s.href}"${ext(s)} aria-label="${s.label}">${ICON[s.label]}</a>`).join('');
  document.getElementById('socials').innerHTML = SOCIALS.map(s => `<a href="${s.href}"${ext(s)}>${s.label === 'X' ? 'x.com' : s.label.toLowerCase()}</a>`).join('');
  document.getElementById('mochi-art').innerHTML = sleepyCat();
  document.getElementById('cat-ic').innerHTML = sleepyCat();

  setTimeout(() => document.querySelector('.mark h1').classList.remove('load'), 2400);

  // ---- garden + bee
  const canvas = document.getElementById('garden');
  let garden = { plant() {}, patches: () => [] };
  try {
    const { createGarden } = await import('./js/garden.js');
    garden = createGarden(canvas, {
      initial: 'auto',
      // sit the bed between the name and the nav
      bed: (w, h, mob) => mob ? { cx: w / 2, cy: h * .52, bw: Math.min(250, w - 120), bh: 200 }
                              : { cx: w / 2, cy: h * .55, bw: Math.min(620, w - 80), bh: 190 },
    });
  } catch (e) { console.warn('garden unavailable', e); }

  const bee = createBee({ spots: () => garden.patches().flatMap(p => p.flowers), start: 2.4 });
  const about = createAbout({ bee });

  const hint = document.getElementById('hint'), swap = hint.querySelector('.swap');
  const AFTER = ['lovely. the bee noticed.', 'keep going, it suits you.', 'a little garden of your own.', 'the bee is very busy now.'];
  let planted = 0, hintT;
  function nudgeHint() {
    if (planted > AFTER.length + 2) return;
    const text = AFTER[Math.min(planted - 1, AFTER.length - 1)];
    swap.classList.add('out');
    clearTimeout(hintT);
    hintT = setTimeout(() => {
      const keep = swap.innerHTML;
      swap.textContent = text; swap.classList.remove('out');
      hintT = setTimeout(() => { swap.classList.add('out'); setTimeout(() => { swap.innerHTML = keep; swap.classList.remove('out'); }, 300); }, 2600);
    }, 300);
  }
  function plant(x, y) {
    const p = garden.plant(x, y);
    planted++;
    nudgeHint();
    const fl = p?.flowers?.length ? p.flowers[Math.floor(Math.random() * p.flowers.length)] : null;
    if (fl) setTimeout(() => bee.visit(fl), reduced ? 0 : 500);
  }
  // somewhere open near the bed, for the keyboard
  function plantSomewhere() {
    const m = innerWidth <= 640, w = canvas.clientWidth, h = canvas.clientHeight;
    const a = Math.random() * Math.PI * 2, r = .55 + Math.random() * .45;
    plant(w / 2 + Math.cos(a) * (m ? 130 : 380) * r, h * (m ? .52 : .55) + Math.sin(a) * (m ? 110 : 150) * r);
  }
  canvas.addEventListener('click', e => { if (!about.isOpen) plant(e.offsetX, e.offsetY); });
  hint.addEventListener('click', plantSomewhere);

  // ---- work: one scroll below; mounted when it gets close
  const work = document.getElementById('work');
  const toWork = () => work.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' });
  document.querySelectorAll('[data-work], #mochi').forEach(b => b.addEventListener('click', toWork));
  let mounted = false;
  const mountWork = async () => {
    if (mounted) return; mounted = true;
    try { (await import('./js/work.js')).mountWork(work); } catch (e) { console.warn('work unavailable', e); }
  };
  new IntersectionObserver((es, io) => { if (es.some(e => e.isIntersecting)) { io.disconnect(); mountWork(); } }, { rootMargin: '100% 0px' }).observe(work);

  // ---- about: the bee flies over and becomes the panel
  document.querySelectorAll('[data-about]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); about.isOpen ? about.close() : about.open(b); }));

  // ---- mochi nudges once, unless they're already looking at the work
  setTimeout(() => {
    if (scrollY > innerHeight * .3 || about.isOpen) return;
    const pk = peek({ text: 'psst. want to see what soumik made?', onOpen: toWork });
    // once they're looking at the work, mochi has nothing left to say
    const off = () => { if (scrollY > innerHeight * .5) { pk.hide(); removeEventListener('scroll', off); } };
    addEventListener('scroll', off, { passive: true });
  }, 4200);
  if (location.hash === '#about') setTimeout(() => about.open(document.querySelector('.nav [data-about]')), 1200);
</script>
</body>
</html>
